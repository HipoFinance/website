# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Rebuilds four times a day so the live protocol numbers baked into the HTML at build time
  # (APY, TVL, holders — see src/data/gauge.ts) never go more than ~6 hours stale for crawlers
  # and for the first paint. Visitors get the current figures either way: the landing and HPO
  # pages re-fetch the gauge in the browser and correct the baked values in place.
  # Note GitHub disables scheduled workflows in a repository with no activity for 60 days; it
  # emails the maintainers first and the "Enable workflow" button restores it.
  schedule:
    - cron: "17 */6 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, not the default shallow fetch-depth: 1. The sitemap's per-URL <lastmod>
          # is the newest commit date of each page's content inputs (src/data/lastmod.mjs), and in a
          # shallow clone every file reports the tip commit — which would tell Google that all ~512
          # URLs changed on every deploy and get the signal distrusted site-wide. The module refuses
          # to emit any lastmod when it detects a shallow clone, so the visible symptom of losing
          # this line is a sitemap with no dates at all.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist repository
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # A deploy that responds is not a deploy that works. On 2026-09-08 one import moved
      # @ton/core into the eager island chunk, ahead of the Buffer polyfill behind loadChain(),
      # and every app page served 200 with a complete shell and then rendered nothing. The build
      # passed. The deploy passed. Only a person opening the site found it.
      #
      # So the last step loads the real pages in the runner's Chrome and fails if they throw during
      # hydration. Note the thresholds cannot be what catches this: the broken page still rendered
      # ~1 KB of static shell. The uncaught-exception check is the one that matters -- verified by
      # rebuilding that exact regression and watching this report "ReferenceError: Buffer is not
      # defined".
      #
      # /stats/ and /stake/ are the two chosen because both read the chain through the island, so a
      # pass means the lazy chain chunk loaded and hydrated, not merely that Astro emitted HTML.
      - name: Verify the deployed pages actually render
        run: |
          node scripts/render-check.mjs \
            --min-text=800 \
            --expect='APY' \
            --expect='hGRAM' \
            https://hipo.finance/stats/ \
            https://hipo.finance/stake/
