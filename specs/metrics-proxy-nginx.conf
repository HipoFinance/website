# Reverse proxy exposing the internal Prometheus query API for the dApp's Stats
# charts. Companion to specs/app-stats-charts.md — copy into the nginx stack in
# the configs repo; it is kept here so the website PR carries the full contract.
#
# Mount: https://gauge.hipo.finance/prometheus/api/v1/query_range — the ONLY
# public route into Prometheus, path-mounted beside the existing gauge routes
# (/data, /metrics stay untouched). Everything else on the Prometheus API
# either destroys (admin/lifecycle), leaks (status/config carries scrape
# credentials; targets/rules map internal hosts; series/labels enumerate every
# job), or bulk-exports (federate, pprof). CORS is not the access control here
# — the query allowlist is.
#
# Requires: the nginx service attached to the monitor overlay network so
# prometheus1/prometheus2 resolve.

# ---- http context ----------------------------------------------------------

# The exact query string the app sends, percent-encoded byte-for-byte as
# encodeURIComponent produces it (see charts/prometheus.ts). A chart change
# that edits the query needs this map updated in the same deploy.
map $arg_query $prom_allowed_query {
    default 0;
    # The dApp must emit the metrics in this exact order for the
    # byte-for-byte match to hold.
    "max%20by%20(__name__)%20(%7B__name__%3D~%22hipo_treasury_apy%7Chipo_treasury_total_coins%7Chipo_treasury_hton_rate%7Chipo_treasury_protocol_fee%7Chipo_hton_holders_count%7Chipo_hton_current_price%7Chipo_hpo_current_price%7Chipo_ton_current_price%22%7D)" 1;
}

# Steps the app's range presets produce (24h/7d/30d/90d/1y).
map $arg_step $prom_allowed_step {
    default 0;
    "300" 1;
    "1800" 1;
    "7200" 1;
    "21600" 1;
    "86400" 1;
}

limit_req_zone $binary_remote_addr zone=promquery:10m rate=10r/m;

proxy_cache_path /var/cache/nginx/promquery levels=1 keys_zone=promquerycache:10m
                 max_size=64m inactive=30m;

upstream prometheus_ha {
    server prometheus1:9090;
    server prometheus2:9090 backup;
}

# ---- inside the existing gauge.hipo.finance server block --------------------

    # Anything under /prometheus/ that is not the one allowed route.
    location /prometheus/ {
        return 404;
    }

    location = /prometheus/api/v1/query_range {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://hipo.finance";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405; # POST reaches query_range too; bodies dodge logs and length caps
        }
        if ($prom_allowed_query = 0) {
            return 403;
        }
        if ($prom_allowed_step = 0) {
            return 403;
        }

        limit_req zone=promquery burst=10 nodelay;

        # The app snaps start/end to the step, so inside one step window every
        # user requests a byte-identical URL — this cache absorbs essentially
        # all traffic; Prometheus sees ~1 query per range per 5 minutes.
        proxy_cache promquerycache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;

        # Prometheus does its own CORS (--web.cors.origin defaults to .*) and
        # echoes the request Origin; hide its headers or the browser sees
        # Access-Control-Allow-Origin twice and rejects the response.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;

        add_header Access-Control-Allow-Origin "https://hipo.finance" always;
        add_header Vary Origin always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;

        # Strip the /prometheus mount prefix before handing to Prometheus.
        rewrite ^/prometheus(/.*)$ $1 break;
        proxy_pass http://prometheus_ha;
        proxy_read_timeout 35s; # slightly above --query.timeout=30s on Prometheus
    }
