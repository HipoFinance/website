# Reverse proxy exposing the internal Prometheus query API for the dApp's Stats
# charts. Companion to specs/app-stats-charts.md — copy into the nginx stack in
# the configs repo; it is kept here so the website PR carries the full contract.
#
# Exposes EXACTLY one route (GET /api/v1/query_range) with the one fixed query
# the app sends. Everything else on the Prometheus API either destroys
# (admin/lifecycle), leaks (status/config carries scrape credentials; targets/
# rules map internal hosts; series/labels enumerate every job), or bulk-exports
# (federate, pprof). CORS is not the access control here — the allowlist is.
#
# Requires: a TLS cert covering metrics.hipo.finance, and the nginx service
# joined to the monitor overlay network so prometheus1/prometheus2 resolve.

# ---- http context ----------------------------------------------------------

# The exact query string the app sends, percent-encoded byte-for-byte as
# encodeURIComponent produces it (see charts/prometheus.ts). A chart change
# that edits the query needs this map updated in the same deploy.
map $arg_query $metrics_allowed_query {
    default 0;
    "max%20by%20(__name__)%20(%7B__name__%3D~%22hipo_treasury_apy%7Chipo_treasury_total_coins%7Chipo_hton_holders_count%7Chipo_hton_current_price%7Chipo_hpo_current_price%7Chipo_ton_current_price%22%7D)" 1;
}

# Steps the app's range presets produce (24h/7d/30d/90d/1y).
map $arg_step $metrics_allowed_step {
    default 0;
    "300" 1;
    "1800" 1;
    "7200" 1;
    "21600" 1;
    "86400" 1;
}

limit_req_zone $binary_remote_addr zone=metrics:10m rate=10r/m;

proxy_cache_path /var/cache/nginx/metrics levels=1 keys_zone=metricscache:10m
                 max_size=64m inactive=30m;

upstream prometheus_ha {
    server prometheus1:9090;
    server prometheus2:9090 backup;
}

# ---- server ----------------------------------------------------------------

server {
    listen 443 ssl;
    http2 on;
    server_name metrics.hipo.finance;

    # Match the TLS setup of the other hipo.finance servers in this stack.
    ssl_certificate     /etc/ssl/certs/hipo.finance.cer;
    ssl_certificate_key /run/secrets/hipo.finance.key;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Everything not explicitly allowed below.
    location / {
        return 404;
    }

    location = /api/v1/query_range {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://hipo.finance";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405; # POST reaches query_range too; bodies dodge logs and length caps
        }
        if ($metrics_allowed_query = 0) {
            return 403;
        }
        if ($metrics_allowed_step = 0) {
            return 403;
        }

        limit_req zone=metrics burst=10 nodelay;

        # The app snaps start/end to the step, so inside one step window every
        # user requests a byte-identical URL — this cache absorbs essentially
        # all traffic; Prometheus sees ~1 query per range per 5 minutes.
        proxy_cache metricscache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;

        add_header Access-Control-Allow-Origin "https://hipo.finance" always;
        add_header Vary Origin always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://prometheus_ha;
        proxy_read_timeout 35s; # slightly above --query.timeout=30s on Prometheus
    }

    # Probing shows up as 403/404 spikes; log the (truncated) query for that.
    access_log /var/log/nginx/metrics.access.log;
}
