# nginx contract for https://v4.hipo.finance -- the dApp's primary TonClient4
# read endpoint (see specs/ton-v4-read-endpoint.md). Deployed from the
# HipoGang/nginx repo (config/v4.hipo.finance.conf plus the http-context
# pieces in nginx.conf); kept in sync with the deployed config, same
# convention as specs/metrics-proxy-nginx.conf.

# ---- http context (nginx.conf) ----------------------------------------------

  # Self-hosted tonwhales ton-api-v4 in front of our own liteserver, serving
  # v4.hipo.finance -- see config/v4.hipo.finance.conf.
  upstream tonv4_upst {
      server tonv4:3000;
  }

  # --- TON v4 read endpoint (website repo: specs/ton-v4-read-endpoint.md) ---
  # Sized for the dApp's polling pattern: the island polls every 30s and fans
  # out several reads per block. A starting point, to tune once real traffic
  # has been observed.
  limit_req_zone $binary_remote_addr zone=tonv4:10m rate=120r/m;

  # Block-keyed v4 responses are immutable and dominate the working set, so
  # entries should age out by max_size rather than by time.
  proxy_cache_path /var/cache/nginx/tonv4 levels=1:2 keys_zone=tonv4cache:20m
                   max_size=512m inactive=7d;

# ---- config/v4.hipo.finance.conf --------------------------------------------

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name v4.hipo.finance;

    ssl_certificate         /etc/ssl/certs/hipo.finance.cer;
    ssl_certificate_key     /run/secrets/hipo.finance.key;

    include /etc/nginx/snippets/letsencrypt-acme-challenge.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/error-pages.conf;

    access_log  /var/log/nginx/tonv4.log  main;
    error_log /var/log/nginx/tonv4-error.log warn;

    # ton-api-v4 also exposes websocket block watchers. The dApp does not use
    # them and the http-level `proxy_set_header Connection ""` would break the
    # upgrade anyway, so refuse them instead of hanging the client.
    location ^~ /block/watch {
        return 404;
    }

    # The website's TonClient4 (website repo: specs/ton-v4-read-endpoint.md).
    # Reads only, one origin, rate-limited, and cached on the upstream's own
    # Cache-Control. CORS is not the access control here — the method filter
    # and the rate limit are.
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://hipo.finance";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405; # blocks POST /send; wallets broadcast their own bocs
        }

        # The island polls every 30s and fans out several reads per block, so a
        # single tab sits well under this and the burst covers the fan-out.
        # Cloudflare fronts this host, so $binary_remote_addr is the real client
        # ip, validated by the realip ranges in nginx.conf.
        limit_req zone=tonv4 burst=60 nodelay;
        limit_req_status 429; # the default 503 reads as an outage in the logs

        # ton-api-v4 sets its own Cache-Control: max-age=31536000 on every
        # block-keyed response (those are immutable) and 1-5s on /block/latest.
        # This cache and the browser both follow it, which is why there is
        # deliberately no proxy_cache_valid overriding it here.
        proxy_cache tonv4cache;
        proxy_cache_key $request_uri;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;

        # The http-level `expires $expires` map maps application/json to -1,
        # which replaces the upstream Cache-Control with no-cache and throws
        # away every immutable response at the browser. Opt out of it.
        expires off;

        # Fastify answers Access-Control-Allow-Origin: * to every origin; hide
        # its headers or the browser sees the value twice and rejects the
        # response.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;

        # add_header here drops the server-level set (all-or-nothing), so the
        # security headers must be repeated alongside the CORS ones.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Access-Control-Allow-Origin "https://hipo.finance" always;
        add_header Vary Origin always;
        add_header X-Cache-Status $upstream_cache_status always;

        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://tonv4_upst;
        proxy_read_timeout 20s;
    }
}
